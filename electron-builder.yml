appId: app.multiframe.browser
productName: MultiFrame Browser
copyright: MIT © 2026 MultiFrame Browser contributors

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# Ф-12.3 — перелік ліцензій сторонніх компонентів у теці встановлення.
# Користувацька документація (2026-08-03) — той самий принцип: постачається
# разом із застосунком, не лише в git-репозиторії вихідного коду.
extraResources:
  - from: THIRD-PARTY-LICENSES.txt
    to: THIRD-PARTY-LICENSES.txt
  - from: docs/USER-GUIDE.en.md
    to: docs/USER-GUIDE.en.md
  - from: docs/USER-GUIDE.uk.md
    to: docs/USER-GUIDE.uk.md
  - from: docs/PRIVACY-POLICY.en.md
    to: docs/PRIVACY-POLICY.en.md
  - from: docs/PRIVACY-POLICY.uk.md
    to: docs/PRIVACY-POLICY.uk.md
  - from: docs/EULA.en.md
    to: docs/EULA.en.md
  - from: docs/EULA.uk.md
    to: docs/EULA.uk.md

win:
  # НФ-3.2/користувач 2026-08-03: portable-версія додана поряд з інсталятором.
  # artifactName свій у кожного — інакше обидва таргети claim того самого
  # імені файла (${ext} для обох 'exe') і другий перезаписав би перший.
  target: [nsis, portable]
  # НФ-3.1 — підпис коду. Репутацію SmartScreen треба накопичувати
  # з першої внутрішньої збірки, а не з релізу.
  signingHashAlgorithms: [sha256]
  # Без цього electron-builder тягне winCodeSign (macOS-інструменти для
  # перевірки підпису оновлень) навіть для чисто Windows-збірки — архів
  # містить symlink'и, які без Developer Mode / прав адміністратора не
  # розпаковуються на Windows (ERROR: Cannot create symbolic link).
  # Підпису однаково ще немає (сертифікат — розділ 10 STATE.md), тож
  # перевіряти зараз нічого.
  verifyUpdateCodeSignature: false

nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Ф-8.19 — інсталятор локалізується тими самими п'ятьма мовами
  displayLanguageSelector: true
  installerLanguages: [en_US, uk_UA, de_DE, es_ES, fr_FR]

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# НФ-3.2 — GitHub Releases цього репозиторію, рішення користувача
# 2026-08-03. `electron-updater` читає ці дані з `app-update.yml`,
# який electron-builder генерує лише в ЗІБРАНОМУ (не dev) застосунку.
publish:
  provider: github
  owner: homedoer-oss
  repo: multiframe_app
